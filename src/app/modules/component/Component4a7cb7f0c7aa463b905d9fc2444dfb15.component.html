<div class="flex flex-col flex-auto min-w-0" *ngIf="data">

    <ng-container>

      <div class="ml-1" [innerHTML]="data.component?.content?.question"></div>

      <mat-checkbox *ngFor="let option of data.component?.content?.options"
      (change)="onAnswerChange($event)"
      [checked]="isChecked(option.key)"
      [value]="option.key" 
      >
      {{ option.value }}
      </mat-checkbox>
    
    </ng-container>
    
    

</div>
